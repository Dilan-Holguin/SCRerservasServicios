buildscript {
    repositories {
        mavenCentral()
    }
}

plugins {
	id 'io.github.jumosqu12.screenplayarchitecture' version '2.0.1'
	id 'java'
    id 'eclipse'
    id 'idea'
}

group 'co.edu.udea.certificacion'

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

repositories {
    mavenCentral()
}

ext {
    serenityVersion = '4.1.0'
    serenityCucumberVersion = '4.1.0'
    junit = '4.13.2'
    hamcrest = '1.3'
}

dependencies {
    implementation "net.serenity-bdd:serenity-core:$rootProject.ext.serenityVersion"
    implementation "net.serenity-bdd:serenity-junit:$rootProject.ext.serenityVersion"
    implementation "net.serenity-bdd:serenity-screenplay:$rootProject.ext.serenityVersion"
    implementation "net.serenity-bdd:serenity-screenplay-webdriver:$rootProject.ext.serenityVersion"
    implementation "net.serenity-bdd:serenity-cucumber:$rootProject.ext.serenityCucumberVersion"
    implementation 'org.slf4j:slf4j-simple:2.0.5'

    //Test compilation
    testImplementation "junit:junit:$rootProject.ext.junit"
    testImplementation "org.hamcrest:hamcrest-all:$rootProject.ext.hamcrest"

}

tasks.named('test') {
    useJUnit()
    include '**/Runner.class'
    maxParallelForks = 1
    maxHeapSize = '256m'
    jvmArgs '-XX:ActiveProcessorCount=2', '-XX:ReservedCodeCacheSize=64m'
    systemProperty 'serenity.outputDirectory', layout.buildDirectory.dir('reports/serenity').get().asFile.absolutePath
    doFirst { delete layout.buildDirectory.dir('reports/serenity') }
    systemProperty 'cucumber.filter.tags', System.getProperty('cucumber.filter.tags',
            System.getenv('CUCUMBER_FILTER_TAGS') ?: '@ui and not @pendiente_producto')
    ['reservaya.web.url', 'mailpit.web.url',
     'cucumber.filter.tags', 'cucumber.execution.dry-run', 'headless.mode', 'webdriver.chrome.driver',
     'webdriver.wait.for.timeout', 'mailpit.wait.timeout', 'demo.pause.milliseconds'].each { key ->
        if (System.getProperty(key) != null) systemProperty key, System.getProperty(key)
    }
    testLogging {
        events 'passed', 'skipped', 'failed'
        exceptionFormat = 'full'
        showExceptions = true
        showCauses = true
        showStackTraces = true
    }
    outputs.upToDateWhen { false }
    finalizedBy 'reporteSerenity'
}

tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }

tasks.register('reporteSerenity', JavaExec) {
    description = 'Genera el reporte HTML de Serenity con los resultados de la última ejecución.'
    group = 'verification'
    maxHeapSize = '256m'
    jvmArgs '-XX:ActiveProcessorCount=2', '-XX:ReservedCodeCacheSize=64m'
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'co.edu.udea.certificacion.prueba.support.GenerarReporte'
    args layout.buildDirectory.dir('reports/serenity').get().asFile.absolutePath
    onlyIf {
        System.getProperty('cucumber.execution.dry-run') != 'true' &&
                !fileTree(layout.buildDirectory.dir('reports/serenity')).matching { include '*.json' }.isEmpty()
    }
}
