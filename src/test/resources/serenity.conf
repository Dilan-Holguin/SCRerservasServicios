serenity {
    project.name = "ReservaYa - E2E UI"
    take.screenshots = FOR_FAILURES
    test.root = co.edu.udea.certificacion.prueba
    report.encoding = UTF-8
}
webdriver {
    driver = chrome
    autodownload = true
    timeouts.implicitlywait = 0
    # ESPERA MAXIMA (ms) para que un elemento de ReservaYa aparezca o cambie.
    wait.for.timeout = 15000
}
# Espera máxima (ms) para que llegue un correo a Mailpit.
mailpit.wait.timeout = 30000
# Pausa fija (ms) entre acciones, solo para exponer: 0 para trabajar, 2000 para mostrar.
demo.pause.milliseconds = 0
chrome.switches = "--window-size=1440,1000;--disable-dev-shm-usage;--no-sandbox;--lang=es-CO"
